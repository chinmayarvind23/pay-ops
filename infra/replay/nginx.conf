worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 10s;
    keepalive_timeout 10s;

    server {
        listen 7860;
        root /srv/payops;
        # There is no proxy, operational API, upload handler or runtime credential use.
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors https://huggingface.co https://*.hf.space" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
        location = /health { default_type text/plain; return 200 "ok\n"; }
        location = / { try_files /index.html =404; }
        location = /index.html { try_files $uri =404; }
        location ~ ^/index-[a-z0-9]+\.(js|css)$ { try_files $uri =404; }
        location / { return 404; }
    }
}
