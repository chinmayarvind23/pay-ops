apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: payops-data
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: payops-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: payops-data
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 300
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: payops
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: docker.io/library/redis:8.2.9-bookworm@sha256:7d1e4ce8b9395088377ab382d1f6cfdbd13b3690795198a0399ab8d683064d6d
        ports:
        - name: client
          containerPort: 6379
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
            ephemeral-storage: 256Mi
        startupProbe:
          tcpSocket:
            port: client
          periodSeconds: 2
          timeoutSeconds: 1
          failureThreshold: 90
        livenessProbe:
          tcpSocket:
            port: client
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          exec:
            command:
            - redis-cli
            - --tls
            - --cacert
            - /run/payops/ca.crt
            - --user
            - payops_probe
            - -h
            - localhost
            - -p
            - '6379'
            - ping
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: false
        - name: config
          mountPath: /etc/payops-redis
          readOnly: true
        - name: credentials
          mountPath: /run/payops
          readOnly: true
        - name: temporary
          mountPath: /tmp
          readOnly: false
        args:
        - redis-server
        - /etc/payops-redis/redis.conf
        env:
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: payops-redis-credentials
              key: probe-password
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: redis-data
      - name: config
        configMap:
          name: payops-redis-config
      - name: credentials
        secret:
          secretName: payops-redis-credentials
          defaultMode: 288
      - name: temporary
        emptyDir:
          sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: payops-data
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: payops
  ports:
  - name: client
    port: 6379
    targetPort: client
