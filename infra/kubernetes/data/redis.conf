# Cache eviction cannot grant an approval or establish an authoritative action result.
bind 0.0.0.0
protected-mode yes
port 0
tls-port 6379
tls-cert-file /run/payops/tls.crt
tls-key-file /run/payops/tls.key
tls-ca-cert-file /run/payops/ca.crt
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
aclfile /run/payops/users.acl
dir /data
maxclients 64
maxmemory 128mb
maxmemory-policy allkeys-lru
timeout 60
tcp-keepalive 30
save ""
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 32mb
client-output-buffer-limit normal 8mb 2mb 10
proto-max-bulk-len 1mb
maxmemory-clients 16mb
loglevel warning
