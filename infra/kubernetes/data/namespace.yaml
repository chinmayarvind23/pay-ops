apiVersion: v1
kind: Namespace
metadata:
  name: payops-data
  labels:
    app.kubernetes.io/part-of: payops
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: data-budget
  namespace: payops-data
spec:
  hard:
    requests.cpu: "1"
    limits.cpu: "3"
    requests.memory: 2Gi
    limits.memory: 3Gi
    requests.storage: 5Gi
    persistentvolumeclaims: "3"
    pods: "4"
    services: "3"
---
# The current kind CNI does not enforce NetworkPolicy. TLS and service authentication
# are required independently; this policy documents intent for an enforcing CNI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-ingress
  namespace: payops-data
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: payops-data
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: payops-sandbox
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: payops
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 9200}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
