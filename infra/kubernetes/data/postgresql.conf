# Local incident-state database; synthetic payment ledgers remain a separate simulator.
listen_addresses = '*'
port = 5432
unix_socket_directories = '/var/run/postgresql'
hba_file = '/etc/payops-postgres/pg_hba.conf'
ssl = on
ssl_cert_file = '/run/payops/tls.crt'
ssl_key_file = '/run/payops/tls.key'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = 'scram-sha-256'
max_connections = 20
superuser_reserved_connections = 3
shared_buffers = 64MB
work_mem = 2MB
maintenance_work_mem = 16MB
temp_file_limit = 32MB
max_wal_size = 128MB
min_wal_size = 32MB
max_parallel_workers_per_gather = 0
statement_timeout = 5s
lock_timeout = 1s
idle_in_transaction_session_timeout = 5s
idle_session_timeout = 60s
authentication_timeout = 3s
log_statement = 'none'
log_min_duration_statement = -1
log_min_error_statement = 'panic'
