global:
  scrape_interval: 5s
  scrape_timeout: 2s
  evaluation_interval: 15s
scrape_configs:
  - job_name: payops-sandbox
    metrics_path: /metrics
    sample_limit: 2000
    body_size_limit: 1MB
    label_limit: 12
    label_name_length_limit: 64
    label_value_length_limit: 128
    static_configs:
      - targets: [payments-api.payops-sandbox.svc.cluster.local:8080]
        labels:
          service: payments-api
      - targets: [risk-sim.payops-sandbox.svc.cluster.local:8080]
        labels:
          service: risk-sim
      - targets: [ledger-sim.payops-sandbox.svc.cluster.local:8080]
        labels:
          service: ledger-sim
      - targets: [processor-adapter.payops-sandbox.svc.cluster.local:8080]
        labels:
          service: processor-adapter
      - targets: [webhook-sim.payops-sandbox.svc.cluster.local:8080]
        labels:
          service: webhook-sim
