apiVersion: v1
kind: Namespace
metadata:
  name: payops-sandbox
  labels:
    app.kubernetes.io/part-of: payops
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-budget
  namespace: payops-sandbox
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 2Gi
    limits.cpu: "8"
    limits.memory: 4Gi
    pods: "20"
    services.nodeports: "0"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-container-bounds
  namespace: payops-sandbox
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 96Mi
      max:
        cpu: "2"
        memory: 1Gi
