[project]
name = "payops"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "pydantic>=2",
  "uvicorn",
  "langchain",
  "langgraph",
  "langsmith",
  "google-cloud-pubsub",
  "google-cloud-logging",
  "google-cloud-monitoring",
  "google-cloud-storage",
  "redis",
  "sqlalchemy",
  "psycopg[binary]",
  "elasticsearch",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "prometheus-client",
  "httpx",
  "pyyaml",
  "mcp==2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payops"]

[project.scripts]
payops = "payops.cli:main"

[dependency-groups]
dev = ["pytest","pytest-cov","hypothesis","ruff","pyright","mutmut","types-PyYAML"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
