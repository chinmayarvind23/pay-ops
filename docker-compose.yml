services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: payops
      POSTGRES_PASSWORD: payops
      POSTGRES_DB: payops
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    ports: ["9200:9200"]
